<body data-page="register">

<div style="min-height:100vh;background:linear-gradient(160deg,#070f0a,#112718);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="background:#fff;border-radius:16px;padding:2.5rem;width:100%;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <a href="index.html" style="display:flex;justify-content:center;margin-bottom:2rem;text-decoration:none">
      <img src="static/images/logo.png" alt="Miswan Quran Academy" style="height:52px;border-radius:8px">
    </a>
    <h2 style="font-family:'Syne',sans-serif;font-size:1.4rem;margin-bottom:.35rem;text-align:center">Create your account</h2>
    <p style="color:#5a7263;font-size:.88rem;margin-bottom:1.75rem;text-align:center">Join Miswan Academy and begin your Quran journey</p>
    <div id="flash-slot" style="display:contents" data-alert-style="margin-bottom:1rem"></div>
    <form method="POST" id="register-form">
      <div class="form-grid-2">
        <div class="form-group"><label>Full name *</label><input type="text" name="name" placeholder="Your full name" required></div>
        <div class="form-group"><label>Email *</label><input type="email" name="email" placeholder="your@email.com" required></div>
        <div class="form-group"><label>Phone</label><input type="tel" name="phone" placeholder="+32 499 00 00 00"></div>
        <div class="form-group"><label>Country</label><input type="text" name="country" placeholder="e.g. Belgium"></div>
        <div class="form-group"><label>Level</label>
          <select name="level">
            <option value="beginner">Beginner</option>
            <option value="basic">Basic Quran</option>
            <option value="advanced">Advanced / Hifz</option>
            <option value="children">Child</option>
          </select>
        </div>
        <div class="form-group"><label>Password *</label><input type="password" name="password" placeholder="Min. 8 characters" required></div>
        <div class="form-group col-span-2"><label>Confirm password *</label><input type="password" name="password2" placeholder="Repeat password" required></div>
      </div>
      <button type="submit" class="btn-gold" style="width:100%;padding:.9rem;font-size:.95rem;margin-top:1.5rem">Create Account →</button>
    </form>
    <p style="text-align:center;margin-top:1.25rem;font-size:.83rem;color:#5a7263">Already registered? <a href="login.html" style="color:#1a6b3c;font-weight:600">Log in</a></p>
    <p style="text-align:center;margin-top:.5rem;font-size:.83rem"><a href="book-trial.html" style="color:#1a6b3c">Not sure yet? Book a free trial first →</a></p>
  </div>
</div>

<script src="static/js/main.js"></script>
<script src="static/js/supabase.js"></script>
<script src="static/js/config.js"></script>
<script src="static/js/app.js"></script>

</body>
</html>
