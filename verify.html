<body data-page="verify">

<div style="min-height:100vh;background:linear-gradient(160deg,#070f0a,#112718);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="background:#111;border:1px solid rgba(201,168,76,.2);border-radius:16px;padding:2.5rem;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)">

    <a href="index.html" style="display:flex;justify-content:center;margin-bottom:2rem;text-decoration:none">
      <img src="static/images/logo.png" alt="Miswan" style="height:48px;border-radius:8px">
    </a>

    <div style="text-align:center;margin-bottom:2rem">
      <div style="width:60px;height:60px;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto .9rem;font-size:1.5rem">✉️</div>
      <h2 style="font-family:'Syne',sans-serif;font-size:1.35rem;color:#fff;margin-bottom:.4rem">Check your email</h2>
      <p style="color:rgba(255,255,255,.45);font-size:.85rem;line-height:1.6">
        We sent a 6-digit code to<br>
        <strong style="color:#c9a84c" id="verify-email"></strong>
      </p>
    </div>

    <div id="flash-slot" style="display:contents" data-alert-style="margin-bottom:1rem;font-size:.83rem"></div>

    <form method="POST" id="codeForm">
      <div style="display:flex;gap:.6rem;justify-content:center;margin-bottom:1.75rem">
        
        <input type="text" name="d1" id="d1"
          maxlength="1" inputmode="numeric" pattern="[0-9]"
          style="width:44px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;outline:none;transition:border-color .2s"
          onfocus="this.style.borderColor='#c9a84c'"
          onblur="this.style.borderColor='rgba(255,255,255,.15)'"
          required>
        
        <input type="text" name="d2" id="d2"
          maxlength="1" inputmode="numeric" pattern="[0-9]"
          style="width:44px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;outline:none;transition:border-color .2s"
          onfocus="this.style.borderColor='#c9a84c'"
          onblur="this.style.borderColor='rgba(255,255,255,.15)'"
          required>
        
        <input type="text" name="d3" id="d3"
          maxlength="1" inputmode="numeric" pattern="[0-9]"
          style="width:44px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;outline:none;transition:border-color .2s"
          onfocus="this.style.borderColor='#c9a84c'"
          onblur="this.style.borderColor='rgba(255,255,255,.15)'"
          required>
        
        <input type="text" name="d4" id="d4"
          maxlength="1" inputmode="numeric" pattern="[0-9]"
          style="width:44px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;outline:none;transition:border-color .2s"
          onfocus="this.style.borderColor='#c9a84c'"
          onblur="this.style.borderColor='rgba(255,255,255,.15)'"
          required>
        
        <input type="text" name="d5" id="d5"
          maxlength="1" inputmode="numeric" pattern="[0-9]"
          style="width:44px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;outline:none;transition:border-color .2s"
          onfocus="this.style.borderColor='#c9a84c'"
          onblur="this.style.borderColor='rgba(255,255,255,.15)'"
          required>
        
        <input type="text" name="d6" id="d6"
          maxlength="1" inputmode="numeric" pattern="[0-9]"
          style="width:44px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;outline:none;transition:border-color .2s"
          onfocus="this.style.borderColor='#c9a84c'"

    <div style="text-align:center;margin-top:1.5rem">

        <button type="submit" style="background:none;border:none;color:rgba(255,255,255,.4);font-size:.82rem;cursor:pointer;text-decoration:underline">
          Didn't receive the code? Resend
        </button>
      </form>
    </div>

    <p style="text-align:center;margin-top:.75rem;font-size:.8rem">
      <a href="login.html" style="color:rgba(255,255,255,.3)">← Back to login</a>
    </p>
  </div>

<script>
// Auto-focus volgende veld bij invoer
const inputs = document.querySelectorAll('#codeForm input[type="text"]');
inputs.forEach(function(input, idx) {
  input.addEventListener('input', function() {
    this.value = this.value.replace(/[^0-9]/g, '');
    if (this.value.length === 1 && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
    }
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && !this.value && idx > 0) {
      inputs[idx - 1].focus();
    }
  });
  // Paste handler — vul alle vakjes in één keer
  input.addEventListener('paste', function(e) {
    e.preventDefault();
    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    pasted.split('').forEach(function(char, i) {
      if (inputs[i]) inputs[i].value = char;
    });
    if (inputs[pasted.length - 1]) inputs[pasted.length - 1].focus();
  });
});
// Auto-submit als alle 6 vakjes gevuld zijn
inputs[inputs.length - 1].addEventListener('input', function() {
  if ([...inputs].every(i => i.value)) {
    document.getElementById('codeForm').requestSubmit();
  }
});
</script>
