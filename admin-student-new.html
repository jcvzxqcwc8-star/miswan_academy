<div class="dash-main">
  <div class="topbar"><div><h1>Add New Student</h1></div><a href="admin.html" style="font-size:.83rem;color:#5a7263">← Back to dashboard</a></div>
  <div class="dash-content" style="max-width:860px">
    <div id="flash-slot" style="display:contents" data-alert-style=""></div>
    <div class="box"><div class="box-body">
      <form method="POST" id="student-form">
        <div class="form-grid-2">
          <div class="form-group"><label>Full name *</label><input type="text" name="name" value="" required></div>
          <div class="form-group"><label>Email *</label><input type="email" name="email" value="" required></div>
          <div class="form-group"><label>Phone / WhatsApp</label><input type="tel" name="phone" value=""></div>
          <div class="form-group"><label>Country</label><input type="text" name="country" value=""></div>
          <div class="form-group"><label>Level</label>
            <select name="level">
              <option value="beginner" >Beginner</option>
              <option value="basic"    >Basic Quran</option>
              <option value="advanced" >Advanced / Hifz</option>
              <option value="children" >Children</option>
            </select>
          </div>
          <div class="form-group"><label>Plan</label>
            <select name="plan">
              <option value="starter"  >Starter (€20/lesson)</option>
              <option value="monthly"  >Monthly (€70/mo)</option>
              <option value="children" >Children (€15/lesson)</option>
            </select>
          </div>
          <div class="form-group"><label>Password *</label><input type="password" name="password" required placeholder="Set a password"></div>
          <div class="form-group col-span-2"><label>Admin notes (internal only)</label><textarea name="notes" rows="3" placeholder="Anything useful to remember about this student…"></textarea></div>
        </div>
        <div style="display:flex;gap:1rem;margin-top:1.5rem">
          <button type="submit" class="btn-primary-sm" style="padding:.7rem 1.75rem;font-size:.9rem">Add Student</button>
          <a href="admin.html" style="background:#f2f5f3;color:#5a7263;padding:.7rem 1.5rem;border-radius:8px;font-size:.88rem;border:1px solid #d0e4d7">Cancel</a>
        </div>
      </form>
    </div></div>
  </div>
